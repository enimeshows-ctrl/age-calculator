<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Percentage Calculator - Free Online Calculator</title>

  <meta name="description"
    content="Free Percentage Calculator. Calculate percentages, percentage increase and decrease, and find what percent one number is of another.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
    }

    .card {
      background: #fff;
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
    }

    .menu {
      text-align: center;
      margin-bottom: 25px;
    }

    .menu a {
      display: inline-block;
      margin: 4px;
      padding: 8px 11px;
      background: #f1f2ff;
      color: #4f46e5;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .calculator {
      background: #f8f8ff;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 19px;
      margin-bottom: 15px;
      color: #333;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .reset {
      background: #eeeeee;
      color: #333;
      margin-top: 10px;
    }

    .result {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      text-align: center;
      color: #667eea;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 25px;
    }

    @media (max-width: 450px) {
      .card {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="menu">
        <a href="index.html">🏠 Home</a>
        <a href="age-calculator.html">🎂 Age</a>
        <a href="emi-calculator.html">💰 EMI</a>
        <a href="gst-calculator.html">🧾 GST</a>
      </div>

      <h1>📊 Percentage Calculator</h1>

      <p class="subtitle">
        Calculate percentages quickly and easily.
      </p>


      <!-- Calculator 1 -->

      <div class="calculator">

        <h2>1️⃣ What is X% of Y?</h2>

        <label for="percent1">Percentage (%)</label>

        <input
          type="number"
          id="percent1"
          placeholder="Example: 20"
          step="any"
        >

        <label for="number1">Number</label>

        <input
          type="number"
          id="number1"
          placeholder="Example: 500"
          step="any"
        >

        <button onclick="calculatePercent()">
          Calculate
        </button>

        <div class="result" id="result1"></div>

      </div>


      <!-- Calculator 2 -->

      <div class="calculator">

        <h2>2️⃣ X is what % of Y?</h2>

        <label for="number2">Number X</label>

        <input
          type="number"
          id="number2"
          placeholder="Example: 50"
          step="any"
        >

        <label for="number3">Number Y</label>

        <input
          type="number"
          id="number3"
          placeholder="Example: 200"
          step="any"
        >

        <button onclick="findPercentage()">
          Calculate
        </button>

        <div class="result" id="result2"></div>

      </div>


      <!-- Calculator 3 -->

      <div class="calculator">

        <h2>3️⃣ Percentage Increase / Decrease</h2>

        <label for="original">Original Value</label>

        <input
          type="number"
          id="original"
          placeholder="Example: 100"
          step="any"
        >

        <label for="newValue">New Value</label>

        <input
          type="number"
          id="newValue"
          placeholder="Example: 120"
          step="any"
        >

        <button onclick="changePercentage()">
          Calculate
        </button>

        <div class="result" id="result3"></div>

      </div>


      <button class="reset" onclick="resetCalculator()">
        🔄 Reset All
      </button>


      <div class="footer">
        © 2026 Smart Calculator Tools
      </div>

    </div>

  </div>


  <script>

    function showResult(element, text) {
      element.textContent = text;
      element.style.display = "block";
    }


    function calculatePercent() {

      const percent =
        parseFloat(document.getElementById("percent1").value);

      const number =
        parseFloat(document.getElementById("number1").value);

      const result =
        document.getElementById("result1");

      if (isNaN(percent) || isNaN(number)) {

        showResult(
          result,
          "⚠️ Please enter both values."
        );

        return;
      }

      const answer = (percent / 100) * number;

      showResult(
        result,
        percent + "% of " + number + " = " + answer
      );
    }


    function findPercentage() {

      const x =
        parseFloat(document.getElementById("number2").value);

      const y =
        parseFloat(document.getElementById("number3").value);

      const result =
        document.getElementById("result2");

      if (isNaN(x) || isNaN(y) || y === 0) {

        showResult(
          result,
          "⚠️ Please enter valid values."
        );

        return;
      }

      const answer = (x / y) * 100;

      showResult(
        result,
        x + " is " + answer.toFixed(2) + "% of " + y
      );
    }


    function changePercentage() {

      const original =
        parseFloat(document.getElementById("original").value);

      const newValue =
        parseFloat(document.getElementById("newValue").value);

      const result =
        document.getElementById("result3");

      if (isNaN(original) || isNaN(newValue) || original === 0) {

        showResult(
          result,
          "⚠️ Please enter valid values."
        );

        return;
      }

      const change =
        ((newValue - original) / original) * 100;


      if (change > 0) {

        showResult(
          result,
          "📈 Increase: " + change.toFixed(2) + "%"
        );

      } else if (change < 0) {

        showResult(
          result,
          "📉 Decrease: " + Math.abs(change).toFixed(2) + "%"
        );

      } else {

        showResult(
          result,
          "➡️ No change: 0%"
        );
      }
    }


    function resetCalculator() {

      document.getElementById("percent1").value = "";
      document.getElementById("number1").value = "";

      document.getElementById("number2").value = "";
      document.getElementById("number3").value = "";

      document.getElementById("original").value = "";
      document.getElementById("newValue").value = "";

      document.getElementById("result1").style.display = "none";
      document.getElementById("result2").style.display = "none";
      document.getElementById("result3").style.display = "none";
    }

  </script>

</body>
</html>
