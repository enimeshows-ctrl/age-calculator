<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Age Calculator - Exact Age & Birthday</title>
  <meta name="description" content="Free online age calculator. Calculate your exact age, total days, weeks, months and next birthday.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 30px auto;
    }

    .card {
      background: #ffffff;
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.20);
    }

    .title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 15px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .calculate {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .reset {
      background: #eeeeee;
      color: #333;
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      display: none;
      color: #e53935;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .result {
      display: none;
      margin-top: 30px;
    }

    .result-title {
      text-align: center;
      margin-bottom: 18px;
    }

    .age-boxes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .age-box {
      background: #f3f4ff;
      border-radius: 15px;
      padding: 18px 5px;
      text-align: center;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
    }

    .unit {
      margin-top: 5px;
      color: #666;
      font-size: 13px;
    }

    .info {
      margin-top: 15px;
      padding: 18px;
      background: #f8f8f8;
      border-radius: 15px;
      line-height: 1.8;
      font-size: 15px;
    }

    .birthday {
      margin-top: 15px;
      padding: 18px;
      background: #fff4d6;
      border-radius: 15px;
      text-align: center;
      line-height: 1.7;
    }

    .birthday strong {
      color: #d97706;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      .card {
        padding: 22px;
      }

      .title {
        font-size: 27px;
      }

      .buttons {
        flex-direction: column;
      }

      .age-boxes {
        gap: 7px;
      }

      .number {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1 class="title">🎂 Age Calculator</h1>

      <p class="subtitle">
        Calculate your exact age and find out when your next birthday is.
      </p>

      <label for="dob">Date of Birth</label>

      <input type="date" id="dob">

      <div class="buttons">
        <button class="calculate" onclick="calculateAge()">
          Calculate Age
        </button>

        <button class="reset" onclick="resetCalculator()">
          Reset
        </button>
      </div>

      <div class="error" id="error"></div>

      <div class="result" id="result">

        <h2 class="result-title">Your Exact Age</h2>

        <div class="age-boxes">

          <div class="age-box">
            <div class="number" id="years">0</div>
            <div class="unit">Years</div>
          </div>

          <div class="age-box">
            <div class="number" id="months">0</div>
            <div class="unit">Months</div>
          </div>

          <div class="age-box">
            <div class="number" id="days">0</div>
            <div class="unit">Days</div>
          </div>

        </div>

        <div class="info" id="totalInfo"></div>

        <div class="birthday" id="birthdayInfo"></div>

      </div>

      <div class="footer">
        © 2026 Age Calculator
      </div>

    </div>

  </div>

  <script>

    function calculateAge() {

      const input = document.getElementById("dob");
      const error = document.getElementById("error");
      const result = document.getElementById("result");

      error.style.display = "none";
      result.style.display = "none";

      if (!input.value) {
        error.textContent = "Please select your date of birth.";
        error.style.display = "block";
        return;
      }

      const dob = new Date(input.value + "T00:00:00");
      const today = new Date();

      if (dob > today) {
        error.textContent = "Date of birth cannot be in the future.";
        error.style.display = "block";
        return;
      }

      let years = today.getFullYear() - dob.getFullYear();
      let months = today.getMonth() - dob.getMonth();
      let days = today.getDate() - dob.getDate();

      if (days < 0) {
        months--;

        const previousMonth = new Date(
          today.getFullYear(),
          today.getMonth(),
          0
        );

        days += previousMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById("years").textContent = years;
      document.getElementById("months").textContent = months;
      document.getElementById("days").textContent = days;

      const totalDays = Math.floor(
        (today - dob) / (1000 * 60 * 60 * 24)
      );

      const totalWeeks = Math.floor(totalDays / 7);

      const totalMonths =
        (today.getFullYear() - dob.getFullYear()) * 12 +
        (today.getMonth() - dob.getMonth()) -
        (today.getDate() < dob.getDate() ? 1 : 0);

      document.getElementById("totalInfo").innerHTML =
        "📊 <strong>Total:</strong><br>" +
        totalMonths.toLocaleString() + " months<br>" +
        totalWeeks.toLocaleString() + " weeks<br>" +
        totalDays.toLocaleString() + " days";

      calculateBirthday(dob, today);

      result.style.display = "block";
    }


    function calculateBirthday(dob, today) {

      let nextBirthday = new Date(
        today.getFullYear(),
        dob.getMonth(),
        dob.getDate()
      );

      if (nextBirthday < today) {
        nextBirthday.setFullYear(today.getFullYear() + 1);
      }

      const difference = nextBirthday - today;

      const daysLeft = Math.ceil(
        difference / (1000 * 60 * 60 * 24)
      );

      if (daysLeft === 0) {

        document.getElementById("birthdayInfo").innerHTML =
          "🎉 <strong>Happy Birthday!</strong><br>" +
          "Today is your birthday!";

      } else {

        document.getElementById("birthdayInfo").innerHTML =
          "🎈 <strong>Next Birthday</strong><br>" +
          "Your next birthday is in <strong>" +
          daysLeft +
          " days</strong>.";
      }
    }


    function resetCalculator() {

      document.getElementById("dob").value = "";

      document.getElementById("result").style.display = "none";

      document.getElementById("error").style.display = "none";
    }

  </script>

</body>
</html>
